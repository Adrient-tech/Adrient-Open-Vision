<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Adrient OpenVision — Live Instrument</title>
<style>
  :root { --bg:#0b0e14; --panel:#121722cc; --line:#232b3b; --accent:#4da3ff; --text:#e8edf5; --dim:#8a94a8;
          --good:#22d3a5; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; overflow:hidden;
         touch-action:none; }
  header { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:10px;
           padding:10px 16px; background:linear-gradient(#0b0e14ee,#0b0e1400); pointer-events:none; }
  header .logo { width:22px; height:22px; border-radius:6px;
           background:conic-gradient(from 210deg, #4da3ff, #7c5cff 40%, #22d3a5 75%, #4da3ff); }
  header h1 { font-size:15px; font-weight:600; }
  header h1 span { color:var(--dim); font-weight:400; }
  #liveDot { width:9px; height:9px; border-radius:50%; background:#39445c; margin-left:auto; }
  #liveDot.on { background:var(--good); box-shadow:0 0 8px var(--good); }
  #hud { position:fixed; top:52px; left:16px; z-index:10; background:var(--panel); border:1px solid var(--line);
         border-radius:10px; padding:12px 14px; min-width:220px; backdrop-filter:blur(6px); }
  #hud .row { display:flex; justify-content:space-between; gap:16px; padding:3px 0; }
  #hud .k { color:var(--dim); }
  #hud .v { font-variant-numeric:tabular-nums; }
  #hud .v.good { color:var(--good); }
  #hud .v.warn { color:var(--warn); }
  #leadCard { margin-top:8px; border-top:1px solid var(--line); padding-top:8px; font-size:12px; color:var(--dim); }
  #leadCard.risk { color:var(--bad); font-weight:600; animation:flash 0.6s steps(2) infinite; }
  @keyframes flash { 50% { opacity:0.35; } }
  /* Tesla-style speed arc */
  /* Tesla-style drive card: rounded dark card holding the speed arc. */
  #dial { position:fixed; left:50%; transform:translateX(-50%); bottom:64px; z-index:10; width:190px;
          pointer-events:none; background:var(--panel); border:1px solid var(--line);
          border-radius:18px; padding:10px 8px 6px; backdrop-filter:blur(6px); }
  #dial .kmh { font-size:34px; font-weight:700; text-anchor:middle; fill:var(--text); font-variant-numeric:tabular-nums; }
  #dial .unit { font-size:11px; letter-spacing:2px; text-anchor:middle; fill:var(--dim); }
  #legend { position:fixed; top:52px; right:16px; z-index:10; background:var(--panel); border:1px solid var(--line);
            border-radius:10px; padding:10px 12px; font-size:12px; backdrop-filter:blur(6px); }
  #legend .row { display:flex; align-items:center; gap:8px; padding:2px 0; color:var(--dim); }
  #legend .sw { width:10px; height:10px; border-radius:3px; }
  #legend b { color:var(--text); margin-left:auto; padding-left:14px; font-variant-numeric:tabular-nums; }
  #adas { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:10; text-align:center; pointer-events:none; }
  #turn { font-size:30px; color:var(--accent); animation:flash 0.9s infinite; }
  #adasCard { margin-top:6px; display:inline-block; background:var(--panel); border:1px solid var(--line);
              border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; }
  #adasCard.warn { color:var(--bad); border-color:var(--bad); animation:flash 0.7s infinite; }
  #adasCard.info { color:var(--text); }
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; align-items:center; gap:10px;
         padding:10px 16px; background:var(--panel); border-top:1px solid var(--line); backdrop-filter:blur(6px); }
  #bar button, #bar select { background:var(--accent); border:0; color:#04101f; font-weight:600; padding:7px 14px;
                border-radius:8px; cursor:pointer; }
  #bar select { appearance:auto; }
  #liveBtn { background:#1d2636; color:var(--text); border:1px solid var(--line); }
  #liveBtn.on { background:var(--bad); color:#fff; }
  #bar input { flex:1; accent-color:var(--accent); min-width:60px; }
  #frameLabel { color:var(--dim); min-width:110px; text-align:right; font-variant-numeric:tabular-nums; }
  #hint { position:fixed; bottom:64px; right:16px; z-index:9; color:var(--dim); font-size:11px; text-align:right; }
  #err { position:fixed; inset:auto 16px 100px 16px; color:var(--bad); z-index:11; }
  canvas { display:block; }
  @media (max-width:600px) {
    #legend { display:none; }
    #hud { min-width:0; font-size:12px; padding:8px 10px; max-width:44vw; }
    #dial { width:150px; bottom:58px; }
    #adas { top:auto; bottom:150px; width:92vw; }
    #adasCard { font-size:11px; padding:6px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Adrient <b>OpenVision</b> <span>— live instrument</span></h1>
  <div id="liveDot" title="live connection"></div>
</header>
<div id="hud">
  <div class="row"><span class="k">Speed</span><span class="v" id="vSpeed">–</span></div>
  <div class="row"><span class="k">Objects tracked</span><span class="v" id="vVeh">–</span></div>
  <div class="row"><span class="k">Lead distance</span><span class="v" id="vLead">–</span></div>
  <div id="leadCard">Lead vehicle (CIPO): waiting for data…</div>
</div>
<div id="legend">
  <div class="row"><span class="sw" style="background:#4da3ff"></span>Vehicle<b id="cVehicle">0</b></div>
  <div class="row"><span class="sw" style="background:#22d3a5"></span>Person<b id="cPerson">0</b></div>
  <div class="row"><span class="sw" style="background:#ffb454"></span>Truck / bus<b id="cTruck">0</b></div>
  <div class="row"><span class="sw" style="background:#ff6bd6"></span>Bike / moto<b id="cBicycle">0</b></div>
</div>
<div id="adas">
  <div id="turn" hidden>↻</div>
  <div id="adasCard" hidden></div>
</div>
<svg id="dial" viewBox="0 0 190 190">
  <g id="arcTicks"></g>
  <path id="arcFill" fill="none" stroke="#4da3ff" stroke-width="7" stroke-linecap="round"/>
  <text class="kmh" id="kmh" x="95" y="105">0</text>
  <text class="unit" x="95" y="126">KM/H</text>
</svg>
<div id="hint">drag — orbit · wheel / pinch — zoom</div>
<div id="bar">
  <button id="play">Pause</button>
  <select id="view">
    <option value="chase">Chase</option>
    <option value="orbit">Orbit</option>
    <option value="top">Top</option>
    <option value="bev">BEV</option>
  </select>
  <button id="liveBtn">Go live</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1">
  <span id="frameLabel">frame –</span>
</div>
<div id="err"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const err = document.getElementById('err');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 60, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.GridHelper(400, 200, 0x232b3b, 0x161c29));
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(20, 40, 30); scene.add(sun);

const objects = new THREE.Group(); scene.add(objects);
const pathLine = new THREE.Line(
  new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color: 0x4da3ff })
);
scene.add(pathLine);

// ── Our car (ego): textured GLTF model, ~4.6 m long like a real sedan.
// Loaded from assets/car.glb; until it arrives a simple placeholder box shows.
const EGO_LEN = 4.6, EGO_W = 1.9, EGO_H = 1.4;
const egoGroup = new THREE.Group(); scene.add(egoGroup);
{
  const ph = new THREE.Mesh(
    new THREE.BoxGeometry(EGO_LEN, EGO_H, EGO_W),
    new THREE.MeshLambertMaterial({ color: 0xd8e2f2 })
  );
  ph.position.y = EGO_H / 2;
  egoGroup.add(ph);
}
const loader = new GLTFLoader();
loader.load('assets/car.glb', g => {
  // Some free models ship extra scenery (ToyCar has a "Fabric" ground sheet).
  // Keep only the submesh named like a car body and drop the rest.
  const BODY = /car|body|chassis/i, JUNK = /fabric|carpet|ground|sheet|shadow/i;
  let best = null;
  g.scene.updateMatrixWorld(true);
  g.scene.traverse(o => {
    if (!o.isMesh) return;
    const name = (o.name || '') + '|' + (o.material && o.material.name || '');
    if (JUNK.test(name)) return;
    if (BODY.test(name) || !best) best = o; // first non-junk mesh = car body
  });
  if (!best) return;
  const car = new THREE.Group();
  best.removeFromParent();
  car.add(best);
  const box = new THREE.Box3().setFromObject(car);
  const size = box.getSize(new THREE.Vector3());
  const s = EGO_LEN / Math.max(size.x, size.z, 0.001); // normalise length to 4.6 m
  car.scale.setScalar(s);
  box.setFromObject(car);
  car.position.y -= box.min.y;
  car.position.z -= (box.min.z + box.max.z) / 2;
  car.position.x -= (box.min.x + box.max.x) / 2;
  egoGroup.clear(); egoGroup.add(car);
}, undefined, () => { /* keep placeholder box on load failure */ });

// Class-aware materials and geometry factories (footprints come from the scene
// file: w = width (y), l = length (x), h = height).
// Boxes are built length-along-z because scene forward (+x world) maps to
// three.js +z (see position mapping in meshFor / ego placement).
const KIND = {
  vehicle:    { color: 0x4da3ff, geo: g => new THREE.BoxGeometry(g.w, g.h, g.l), y: g => g.h / 2 },
  car:        { color: 0x4da3ff, geo: g => new THREE.BoxGeometry(g.w, g.h, g.l), y: g => g.h / 2 },
  person:     { color: 0x22d3a5, geo: g => new THREE.CapsuleGeometry(g.w / 2, Math.max(0.1, g.h - g.w), 4, 10), y: g => g.h / 2 },
  truck:      { color: 0xffb454, geo: g => new THREE.BoxGeometry(g.w, g.h, g.l), y: g => g.h / 2 },
  bus:        { color: 0xffd166, geo: g => new THREE.BoxGeometry(g.w, g.h, g.l), y: g => g.h / 2 },
  motorcycle: { color: 0xff8f6b, geo: g => new THREE.BoxGeometry(g.w, g.h, g.l), y: g => g.h / 2 },
  bicycle:    { color: 0xff6bd6, geo: g => new THREE.BoxGeometry(g.w, g.h * 0.7, g.l), y: g => g.h * 0.35 },
};
const kindMat = k => new THREE.MeshLambertMaterial({ color: KIND[k]?.color ?? 0x4da3ff,
                      transparent: true, opacity: k === 'vehicle' ? 1 : 0.95 });
const matCache = {};
const matFor = k => matCache[k] || (matCache[k] = kindMat(k));
const stateMat = s => s === 'tentative' ? tentMat : s === 'coasting' ? coastMat : null;
const tentMat = new THREE.MeshLambertMaterial({ color: 0x39445c, transparent: true, opacity: 0.6 });
const coastMat = new THREE.MeshLambertMaterial({ color: 0x7c5cff, transparent: true, opacity: 0.7 });
const geoCache = {};
function meshFor(v) {
  const k = KIND[v.kind] ? v.kind : 'vehicle';
  const g = { w: v.w, l: v.l, h: v.h };
  const key = k + '|' + g.w + '|' + g.l + '|' + g.h;
  const geo = geoCache[key] || (geoCache[key] = KIND[k].geo(g));
  const m = new THREE.Mesh(geo, stateMat(v.state) || matFor(k));
  m.position.set(v.y, KIND[k].y(g), v.x);
  // Flat heading chevron lying on the roof: points the way this vehicle travels.
  const arrow = new THREE.Mesh(arrowGeo, arrowMat);
  arrow.rotation.x = Math.PI / 2;          // cone +y axis → +z (forward)
  arrow.scale.set(1, 1, 0.25);             // flatten so it hugs the roof
  arrow.position.y = v.h / 2 + 0.05;
  m.add(arrow);
  return m;
}
const arrowGeo = new THREE.ConeGeometry(0.28, 0.7, 3);
const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
// Face each box along its own velocity so it reads as a vehicle, not a flat
// rectangle. Travel direction in three.js coords is (x = vy, z = vx), so the
// yaw that turns +z onto it is atan2(vy, vx). Persons are symmetric — skip.
function aimMesh(m, v) {
  if (m.userData.kind !== 'person' && (Math.abs(v.vx) + Math.abs(v.vy)) > 0.3)
    m.rotation.y = Math.atan2(v.vy, v.vx);
}

// ── Persistent track meshes: one mesh per track id, updated in place so the
// same physical vehicle moves smoothly frame to frame instead of flickering.
const trackMeshes = new Map();
function syncObjects(f) {
  const seen = new Set();
  const counts = { vehicle: 0, person: 0, truck: 0, bicycle: 0 };
  const group = k => (k === 'car' || k === 'vehicle') ? 'vehicle'
                   : (k === 'truck' || k === 'bus') ? 'truck'
                   : (k === 'bicycle' || k === 'motorcycle') ? 'bicycle'
                   : k;
  for (const v of f.vehicles) {
    seen.add(v.id);
    let m = trackMeshes.get(v.id);
    if (!m || m.userData.kind !== (KIND[v.kind] ? v.kind : 'vehicle')) {
      if (m) objects.remove(m);
      m = meshFor(v);
      m.userData.kind = KIND[v.kind] ? v.kind : 'vehicle';
      aimMesh(m, v);
      trackMeshes.set(v.id, m);
      objects.add(m);
    } else {
      const k = m.userData.kind, g = { w: v.w, l: v.l, h: v.h };
      m.material = stateMat(v.state) || matFor(k);
      m.position.lerp(new THREE.Vector3(v.y, KIND[k].y(g), v.x), 0.55);
      aimMesh(m, v);
      m.visible = true;
    }
    counts[group(m.userData.kind)]++;
  }
  for (const [id, m] of trackMeshes) {
    if (!seen.has(id)) { objects.remove(m); trackMeshes.delete(id); }
  }
  return counts;
}

// ── Orbit camera (mouse + touch): drag rotates around the ego target,
// wheel / pinch zooms. theta = azimuth, phi = polar, r = radius.
const cam = { theta: Math.PI, phi: 1.05, r: 26, targetX: 0 };
function applyCamera() {
  cam.phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.02, cam.phi)); // stay above ground
  cam.r = Math.max(6, Math.min(120, cam.r));
  const t = new THREE.Vector3(0, 0, cam.targetX);
  camera.position.set(
    t.x + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta),
    t.y + cam.r * Math.cos(cam.phi),
    t.z + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta)
  );
  camera.lookAt(t);
}
let drag = null, pinch = null;
renderer.domElement.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, theta: cam.theta, phi: cam.phi };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.theta = drag.theta + (e.clientX - drag.x) * 0.005;
  cam.phi = drag.phi + (e.clientY - drag.y) * 0.005;
});
renderer.domElement.addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  cam.r *= e.deltaY > 0 ? 1.08 : 0.93;
}, { passive: false });
renderer.domElement.addEventListener('touchmove', e => { // pinch zoom
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) cam.r *= pinch / d;
    pinch = d;
    drag = null;
  }
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => { pinch = null; });

// ── Speed dial (SVG arc, 0..160 km/h sweep of 240°)
const DIAL_MAX_KMH = 160, DIAL_A0 = 150, DIAL_SWEEP = 240;
{
  const g = document.getElementById('arcTicks');
  for (let i = 0; i <= 8; i++) {
    const a = (DIAL_A0 + DIAL_SWEEP * i / 8) * Math.PI / 180;
    const r1 = 82, r2 = i % 2 ? 76 : 72;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 95 + r1 * Math.cos(a)); l.setAttribute('y1', 95 + r1 * Math.sin(a));
    l.setAttribute('x2', 95 + r2 * Math.cos(a)); l.setAttribute('y2', 95 + r2 * Math.sin(a));
    l.setAttribute('stroke', '#39445c'); l.setAttribute('stroke-width', i % 2 ? 2 : 3);
    g.appendChild(l);
  }
}
function setDial(kmh) {
  const frac = Math.min(1, kmh / DIAL_MAX_KMH);
  const a = (DIAL_A0 + DIAL_SWEEP * frac) * Math.PI / 180;
  const large = frac > 0.5 ? 1 : 0;
  const x = 95 + 78 * Math.cos(a), y = 95 + 78 * Math.sin(a);
  const a0 = DIAL_A0 * Math.PI / 180;
  document.getElementById('arcFill').setAttribute('d',
    `M ${95 + 78 * Math.cos(a0)} ${95 + 78 * Math.sin(a0)} A 78 78 0 ${large} 1 ${x} ${y}`);
  document.getElementById('kmh').textContent = Math.round(kmh);
}

const $ = id => document.getElementById(id);
let frames = [], idx = 0, playing = true, lastT = 0;
let live = null, liveLastFrameId = null, liveRetry = 0;

// ── Road surface + lane markings, built from the fitted lane-centre path.
// f.path is our lane's centreline in world coordinates; a real lane is
// 3.5 m wide (standard), so edges sit ±1.75 m and the adjacent lane's
// dashed centre line sits at +3.5 m lateral.
const LANE_W = 3.5;
const roadGroup = new THREE.Group(); scene.add(roadGroup);
const roadMat = new THREE.MeshBasicMaterial({ color: 0x11151d, transparent: true, opacity: 0.94, depthWrite: false });
const edgeMat = new THREE.LineBasicMaterial({ color: 0xd8e2f2 });
const dashMat  = new THREE.LineBasicMaterial({ color: 0xf4c542 });
// Smooth the fitted path: the quadratic lane fit wiggles frame to frame, so a
// moving average (window 5) keeps the road steady under the vehicles.
function smoothPath(path) {
  if (!path || path.length < 5) return path;
  const W = 2, out = [];
  for (let i = 0; i < path.length; i++) {
    let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - W); j <= Math.min(path.length - 1, i + W); j++) {
      sx += path[j][0]; sy += path[j][1]; n++;
    }
    out.push([sx / n, sy / n]);
  }
  return out;
}
// Heading (yaw around +z-forward) of the smoothed path at longitudinal x.
function pathHeadingAt(path, x) {
  const p = smoothPath(path);
  if (!p || p.length < 2) return 0;
  for (let i = 1; i < p.length; i++) {
    if (p[i][0] >= x) {
      const [x0, y0] = p[i - 1], [x1, y1] = p[i];
      return Math.atan2(y1 - y0, x1 - x0);
    }
  }
  const [xa, ya] = p[p.length - 2], [xb, yb] = p[p.length - 1];
  return Math.atan2(yb - ya, xb - xa);
}
function ribbon(pts, half, y) {
  // Triangulated ribbon: for each path point, two vertices at (y ± half).
  const pos = [], idxArr = [];
  pts.forEach(([x, ly], i) => {
    pos.push(ly - half, y, x, ly + half, y, x);
    if (i > 0) {
      const a = 2 * i - 2;
      idxArr.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idxArr);
  return g;
}
function updateRoad(pathIn) {
  roadGroup.clear();
  const path = smoothPath(pathIn);
  if (!path || path.length < 2) return;
  // Asphalt: one lane either side of our centreline.
  const asphalt = new THREE.Mesh(ribbon(path, LANE_W, 0.02), roadMat);
  roadGroup.add(asphalt);
  // Solid lane edges.
  for (const s of [-LANE_W / 2, LANE_W / 2])
    roadGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      path.map(([x, y]) => new THREE.Vector3(y + s, 0.04, x))), edgeMat));
  // Dashed adjacent-lane divider (3 m dash / 3 m gap), on the left of our lane.
  const dashes = [];
  for (let i = 0; i + 1 < path.length; i++) {
    if (i % 2) continue; // alternate segments = dash/gap
    const [x1, y1] = path[i], [x2, y2] = path[i + 1];
    dashes.push(new THREE.Vector3(y1 + LANE_W + 1.75, 0.04, x1),
                new THREE.Vector3(y2 + LANE_W + 1.75, 0.04, x2));
  }
  roadGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(dashes), dashMat));
  const poleMat = new THREE.MeshLambertMaterial({ color: 0x3a4356 });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xf4e6c0 });
  // Light poles along the verge every ~12 m, alternating sides — matching the
  // freeway in the source video (no trees; it's a highway, not a street).
  for (let i = 2; i < path.length - 2; i += 3) {
    const [x, y] = path[i];
    const side = (i / 3) % 2 ? 1 : -1;         // alternate sides
    const z = y + side * (LANE_W + 1.2);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 6, 6), poleMat);
    pole.position.set(z, 3, x); roadGroup.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.9), lampMat);
    lamp.position.set(z - side * 0.4, 6, x); roadGroup.add(lamp);
  }
}

// ── ADAS: turn indicator from path curvature, forward-collision and
// crossing-vehicle warnings from tracked kinematics.
function updateAdas(f) {
  const turn = $('turn'), card = $('adasCard');
  // Turn indicator: heading change over the next ~12 m of lane path.
  let deg = 0;
  if (f.path.length > 4) {
    const a = f.path[0], b = f.path[Math.min(f.path.length - 1, 12)];
    deg = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
  }
  turn.hidden = Math.abs(deg) < 5;
  if (!turn.hidden) turn.textContent = deg < 0 ? '↰' : '↱';

  // Warnings, worst first.
  let warn = null;
  const c = f.cipo;
  if (c.valid && c.d < 20 && c.v_rel < 0)
    warn = '⚠ Forward collision warning — ' + c.d.toFixed(0) + ' m, closing ' +
           Math.abs(c.v_rel).toFixed(1) + ' m/s';
  if (!warn) for (const v of f.vehicles) {
    // Crossing / cut-in: significant lateral motion ahead, near our lane band.
    const ahead = v.x - f.ego.x;
    if (ahead > 5 && ahead < 45 && Math.abs(v.y) < LANE_W * 1.6 && Math.abs(v.vy) > 0.6) {
      warn = '⚠ Vehicle ' + v.id + ' crossing / cutting in — ' + ahead.toFixed(0) + ' m ahead';
      break;
    }
  }
  card.hidden = !warn;
  if (warn) { card.textContent = warn; card.className = 'warn'; }
  else if (c.valid) {
    card.hidden = false; card.className = 'info';
    card.textContent = 'Lead ' + c.d.toFixed(0) + ' m · ' + (c.v_rel >= 0 ? 'pulling away' : 'closing');
  }
}

function show(i) {
  idx = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[idx];
  if (!f) return;
  $('scrub').value = idx;
  $('scrub').max = frames.length - 1;
  $('frameLabel').textContent = 'frame ' + f.frame_id + '  (' + f.t.toFixed(1) + ' s)';

  objects.visible = true;
  const counts = syncObjects(f);
  $('cVehicle').textContent = counts.vehicle;
  $('cPerson').textContent = counts.person;
  $('cTruck').textContent = counts.truck;
  $('cBicycle').textContent = counts.bicycle;

  pathLine.geometry.setFromPoints(
    smoothPath(f.path).map(([x, y]) => new THREE.Vector3(y, 0.05, x)));
  updateRoad(f.path);
  updateAdas(f);

  // Ego car follows the tracked ego pose. Heading comes from the lane path at
  // the ego's own position, so a real turn yaws the model (and the camera
  // target rides the same forward point).
  egoGroup.position.set(0, 0, f.ego.x);
  const heading = pathHeadingAt(f.path, f.ego.x);
  egoGroup.rotation.y = heading; // model front faces +z (scene forward)

  // Camera follows the ego forward position in chase/orbit views.
  cam.targetX = f.ego.x;
  applyCamera();

  const kmh = f.ego.v * 3.6;
  setDial(kmh);
  $('vSpeed').textContent = f.ego.v.toFixed(1) + ' m/s';
  $('vVeh').textContent = f.vehicles.length;
  const c = f.cipo, lead = $('vLead'), card = $('leadCard');
  if (c.valid) {
    lead.textContent = c.d.toFixed(1) + ' m';
    lead.className = 'v ' + (c.cut_in ? 'warn' : 'good');
    card.textContent = 'Lead vehicle: id ' + c.track_id + ', closing ' +
      Math.abs(c.v_rel).toFixed(1) + ' m/s' + (c.cut_in ? ' — CUT-IN RISK' : '');
    card.className = c.cut_in ? 'risk' : '';
  } else {
    lead.textContent = '–'; lead.className = 'v';
    card.textContent = 'Lead vehicle: none tracked';
    card.className = '';
  }
}

// ── Live client — protocol adrient.openvision/live@1
// {type:"hello",protocol,fps} → client replies {type:"resume",after} when it
// has already seen frames; server streams {type:"frame",frame} and pings
// every 5 s; client answers {type:"pong"}. Reconnect with backoff.
function goLive(on) {
  if (!on) {
    if (live) { live.onclose = null; live.close(); live = null; }
    $('liveBtn').textContent = 'Go live';
    $('liveBtn').classList.remove('on');
    $('liveDot').classList.remove('on');
    playing = true; $('play').textContent = 'Pause';
    return;
  }
  const url = 'ws://' + location.host + '/live';
  live = new WebSocket(url);
  live.onopen = () => {
    liveRetry = 0;
    $('liveBtn').textContent = 'Leave live';
    $('liveBtn').classList.add('on');
    $('liveDot').classList.add('on');
    playing = false; $('play').textContent = 'Play';
  };
  live.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'hello') {
      // Ask only for what we missed so a reconnect resumes, not restarts.
      if (liveLastFrameId !== null) live.send(JSON.stringify({ type: 'resume', after: liveLastFrameId }));
    } else if (m.type === 'frame') {
      liveLastFrameId = m.frame.frame_id;
      frames.push(m.frame);
      show(frames.length - 1);
    } else if (m.type === 'ping') {
      live.send(JSON.stringify({ type: 'pong' }));
    }
  };
  live.onclose = () => {
    $('liveDot').classList.remove('on');
    $('liveBtn').textContent = 'Go live';
    $('liveBtn').classList.remove('on');
    live = null;
    if (liveRetry < 6) {
      const wait = Math.min(15000, 500 * 2 ** liveRetry++) + Math.random() * 300;
      setTimeout(() => { if (!$('liveBtn').classList.contains('on')) goLive(true); }, wait);
    }
  };
}

// ── Data sources: recorded scene.json by default, /live on demand.
fetch('scene.json').then(r => { if (!r.ok) throw new Error('scene.json not found (HTTP '+r.status+')'); return r.json(); })
.then(data => {
  frames = data.frames;
  show(0);
})
.catch(e => { err.textContent = 'Failed to load scene data: ' + e.message; });

function tick(t) {
  if (playing && !live && frames.length && t - lastT > 100) {
    lastT = t;
    show(idx + 1 >= frames.length ? 0 : idx + 1);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('scrub').oninput = e => { playing = false; $('play').textContent = 'Play'; liveLastFrameId = null; show(+e.target.value); };
$('view').onchange = e => {
  const v = e.target.value;
  if (v === 'top') { cam.phi = 0.2; cam.r = 60; }
  else if (v === 'bev') { cam.phi = 0.03; cam.r = 55; }   // near-orthographic bird's-eye
  else if (v === 'chase') { cam.phi = 1.05; cam.theta = Math.PI; cam.r = 26; }
  else { cam.phi = 0.7; cam.theta = Math.PI * 0.75; cam.r = 34; }
};
$('liveBtn').onclick = () => goLive(!live);
</script>
</body>
</html>
